name: Validate SQL project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generate data and verify SQL against independent calculations
        run: python scripts/build.py
      - name: Test counting and historical boundary cases
        run: python scripts/test_boundaries.py
      - name: Run read-only query entry point
        run: python scripts/query.py sql/analysis/01_monthly_trend.sql
